name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Clean old project files
        shell: bash
        run: |
          echo "=== BEFORE CLEANUP ==="
          echo "Old flattened files:"
          find . -type f -name 'lib__*.dart' -print || true

          echo "Nested lib directory:"
          if [ -d "lib/lib" ]; then
            find lib/lib -type f -print
          else
            echo "No nested lib/lib directory"
          fi

          echo "=== CLEANING ==="

          # Remove incorrectly flattened Dart files.
          find . -type f -name 'lib__*.dart' -delete

          # Remove duplicated nested lib directory.
          rm -rf lib/lib

          echo "=== AFTER CLEANUP ==="
          echo "Remaining flattened files:"
          find . -type f -name 'lib__*.dart' -print || true

          echo "Correct lib structure:"
          find lib -maxdepth 4 -type f -print | sort

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
